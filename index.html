<body>
<!-- ============================= -->
<!-- SITE-66 ENTRY SCREEN -->
<!-- ============================= -->

<div id="entry-screen">

    <video id="entry-video" autoplay muted loop playsinline>
        <source src="assets/0819.mp4" type="video/mp4">
    </video>

    <div class="scanlines"></div>
    <div class="entry-overlay"></div>
    <div class="glitch-noise"></div>

    <div class="entry-content">

        <div class="system-text">
            FOUNDATION SECURE NETWORK
        </div>

        <h1 data-text="SITE-66">SITE-66</h1>

        <h2>PERSONNEL DATABASE</h2>

        <div class="loading">
            CONNECTION: <span>ESTABLISHED</span>
        </div>

        <div class="loading">
            SECURITY SYSTEM: <span>ONLINE</span>
        </div>

        <div class="warning">
            ⚠ AUTHORIZED PERSONNEL ONLY ⚠
        </div>

        <button id="enter-button" onclick="enterSite()">
            ENTER DATABASE
        </button>

    </div>

</div>


<!-- ============================= -->
<!-- BACKGROUND MUSIC -->
<!-- ============================= -->

<audio id="background-music" loop preload="auto">
    <source src="assets/2026-08-19 17-31-16[rebalanced].mp3" type="audio/mpeg">
</audio>


<!-- ============================= -->
<!-- ENTRY SCRIPT -->
<!-- ============================= -->

<script>

function enterSite() {

    const screen = document.getElementById("entry-screen");
    const music = document.getElementById("background-music");
    const video = document.getElementById("entry-video");
    const button = document.getElementById("enter-button");

    /* Button effect */
    button.classList.add("pressed");

    /* MUSIC */

    music.volume = 1.0;

    music.currentTime = 0;

    music.play().catch(function(error) {
        console.log("Music could not start:", error);
    });


    /* VIDEO */

    video.currentTime = 0;

    video.play().catch(function(error) {
        console.log("Video could not start:", error);
    });


    /* GLITCH EFFECT */

    screen.classList.add("glitch-out");


    /* Fade screen */

    setTimeout(function() {

        screen.style.opacity = "0";

    }, 700);


    /* Remove entry screen */

    setTimeout(function() {

        screen.style.display = "none";

    }, 1800);

}

</script>
<style>/* ================================= */
/* SITE-66 ENTRY SCREEN */
/* ================================= */

#entry-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 99999;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 1;

}


/* ================================= */
/* VIDEO */
/* ================================= */

#entry-video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0.55;

    filter:
        contrast(1.3)
        brightness(0.65)
        saturate(0.7);

}


/* ================================= */
/* DARK OVERLAY */
/* ================================= */

.entry-overlay {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle,
            transparent 15%,
            rgba(0,0,0,0.8) 100%
        );

    z-index: 2;

}


/* ================================= */
/* CRT SCANLINES */
/* ================================= */

.scanlines {

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.04) 0px,
            rgba(255,255,255,0.04) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 4;

    opacity: 0.8;

    animation: scanlineMove 0.15s infinite;

}


@keyframes scanlineMove {

    0% {
        transform: translateY(0);
    }

    100% {
        transform: translateY(4px);
    }

}


/* ================================= */
/* GLITCH NOISE */
/* ================================= */

.glitch-noise {

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    opacity: 0;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(255,0,0,0.08) 2px,
            transparent 4px
        );

}


/* ================================= */
/* ENTRY CONTENT */
/* ================================= */

.entry-content {

    position: relative;

    z-index: 10;

    text-align: center;

    font-family: monospace;

    animation: screenFlicker 4s infinite;

}


/* ================================= */
/* FOUNDATION TEXT */
/* ================================= */

.system-text {

    color: #777;

    font-size: 13px;

    letter-spacing: 5px;

    margin-bottom: 20px;

}


/* ================================= */
/* SITE-66 TITLE */
/* ================================= */

.entry-content h1 {

    position: relative;

    color: white;

    font-size: clamp(60px, 10vw, 120px);

    letter-spacing: 15px;

    margin: 0;

    text-shadow:

        3px 0 #8b0000,

        -2px 0 #333;

}


/* GLITCH TITLE */

.entry-content h1::before,
.entry-content h1::after {

    content: attr(data-text);

    position: absolute;

    left: 0;

    width: 100%;

    overflow: hidden;

    opacity: 0;

}


.entry-content h1::before {

    color: #ff0000;

    transform: translate(-3px, 0);

}


.entry-content h1::after {

    color: #00ffff;

    transform: translate(3px, 0);

}


/* ================================= */
/* DATABASE TITLE */
/* ================================= */

.entry-content h2 {

    color: #999;

    font-size: 20px;

    letter-spacing: 7px;

    margin-top: 5px;

}


/* ================================= */
/* STATUS TEXT */
/* ================================= */

.loading {

    color: #777;

    font-size: 13px;

    margin-top: 15px;

}


.loading span {

    color: #aaa;

}


/* ================================= */
/* WARNING */
/* ================================= */

.warning {

    color: #a00000;

    font-weight: bold;

    letter-spacing: 3px;

    margin-top: 35px;

    animation: warningBlink 1.5s infinite;

}


/* ================================= */
/* BUTTON */
/* ================================= */

.entry-content button {

    margin-top: 40px;

    padding: 16px 40px;

    background: rgba(0,0,0,0.75);

    color: white;

    border: 1px solid #8b0000;

    cursor: pointer;

    font-family: monospace;

    font-size: 14px;

    letter-spacing: 3px;

    transition: 0.2s;

}


.entry-content button:hover {

    background: #8b0000;

    box-shadow:

        0 0 20px rgba(139,0,0,0.6),

        0 0 40px rgba(139,0,0,0.3);

}


.entry-content button.pressed {

    transform: scale(0.96);

}


/* ================================= */
/* SCREEN FLICKER */
/* ================================= */

@keyframes screenFlicker {

    0%, 95%, 100% {
        opacity: 1;
    }

    96% {
        opacity: 0.85;
    }

    97% {
        opacity: 1;
    }

    98% {
        opacity: 0.7;
    }

}


/* ================================= */
/* WARNING FLICKER */
/* ================================= */

@keyframes warningBlink {

    0%, 80%, 100% {
        opacity: 1;
    }

    85% {
        opacity: 0.4;
    }

    90% {
        opacity: 1;
    }

}


/* ================================= */
/* GLITCH EXIT */
/* ================================= */

#entry-screen.glitch-out {

    animation:

        glitchShake 0.15s infinite,

        glitchFlash 0.8s steps(2);

}


#entry-screen.glitch-out .glitch-noise {

    opacity: 0.8;

}


#entry-screen.glitch-out .entry-content h1::before {

    opacity: 1;

    animation: glitchRed 0.12s infinite;

}


#entry-screen.glitch-out .entry-content h1::after {

    opacity: 1;

    animation: glitchBlue 0.1s infinite;

}


/* ================================= */
/* GLITCH ANIMATIONS */
/* ================================= */

@keyframes glitchShake {

    0% {
        transform: translate(0);
    }

    20% {
        transform: translate(-5px, 2px);
    }

    40% {
        transform: translate(4px, -2px);
    }

    60% {
        transform: translate(-3px, 1px);
    }

    80% {
        transform: translate(5px, -1px);
    }

    100% {
        transform: translate(0);
    }

}


@keyframes glitchFlash {

    0% {
        filter: none;
    }

    20% {
        filter: brightness(1.8);
    }

    40% {
        filter: contrast(2);
    }

    60% {
        filter: brightness(0.5);
    }

    80% {
        filter: brightness(2);
    }

    100% {
        filter: none;
    }

}


@keyframes glitchRed {

    0% {
        clip-path: inset(10% 0 80% 0);
    }

    50% {
        clip-path: inset(60% 0 10% 0);
    }

    100% {
        clip-path: inset(30% 0 50% 0);
    }

}


@keyframes glitchBlue {

    0% {
        clip-path: inset(70% 0 10% 0);
    }

    50% {
        clip-path: inset(20% 0 60% 0);
    }

    100% {
        clip-path: inset(50% 0 30% 0);
    }

}

<script>
function enterSite() {

    const screen = document.getElementById("entry-screen");
    const music = document.getElementById("background-music");

    // Start the music
    music.volume = 1.00;
    music.currentTime = 0;

    music.play().catch(function(error) {
        console.log("Music error:", error);
    });

    // Start glitch effect
    screen.classList.add("glitch-out");

    // Go to the home page
    setTimeout(function() {
        window.location.href = "home.html";
    }, 1500);

}
</script>
