 New", monospace; color: white; } /* ========================================= FOUNDATION TEXT ========================================= */ .system-text { color: #8b9aaa; font-size: 13px; letter-spacing: 5px; margin-bottom: 20px; } /* ========================================= SITE-66 ========================================= */ .entry-content h1 { margin: 0; color: white; font-size: clamp(60px, 10vw, 120px); letter-spacing: 15px; text-shadow: 3px 0 #1677ff, -3px 0 #333; } /* ========================================= DATABASE ========================================= */ .entry-content h2 { margin-top: 10px; color: #a8b7c5; font-size: 20px; letter-spacing: 7px; } /* ========================================= STATUS ========================================= */ .loading { color: #718293; font-size: 13px; margin-top: 15px; } .loading span { color: #b9dfff; } /* ========================================= WARNING ========================================= */ .warning { color: #3c9fff; font-weight: bold; letter-spacing: 3px; margin-top: 35px; } /* ========================================= ENTER BUTTON ========================================= */ .entry-content button { margin-top: 40px; padding: 16px 40px; background: rgba(0,0,0,0.75); color: white; border: 1px solid #1677ff; cursor: pointer; font-family: "Courier New", monospace; font-size: 14px; letter-spacing: 3px; transition: 0.2s; } .entry-content button:hover { background: #1677ff; box-shadow: 0 0 20px rgba(22,119,255,0.7), 0 0 50px rgba(22,119,255,0.3); } .entry-content button:active { transform: scale(0.96); } /* ========================================= AUDIO BUTTON ========================================= */ #audio-button { position: fixed; bottom: 25px; right: 25px; z-index: 20; margin: 0; padding: 10px 15px; background: rgba(0,0,0,0.75); color: #9ecfff; border: 1px solid #315b80; font-family: "Courier New", monospace; font-size: 11px; letter-spacing: 2px; cursor: pointer; } #audio-button:hover { background: #1677ff; color: white; } /* ========================================= GLITCH EXIT ONLY ACTIVATES AFTER ENTER ========================================= */ #entry-screen.glitch-out { animation: glitchShake 0.12s infinite, glitchFlash 0.8s steps(2); } #entry-screen.glitch-out .glitch-noise { opacity: 0.8; } /* ========================================= GLITCH SHAKE ========================================= */ @keyframes glitchShake { 0% { transform: translate(0, 0); } 20% { transform: translate(-7px, 2px); } 40% { transform: translate(6px, -2px); } 60% { transform: translate(-5px, 3px); } 80% { transform: translate(7px, -3px); } 100% { transform: translate(0, 0); } } /* ========================================= GLITCH FLASH ========================================= */ @keyframes glitchFlash { 0% { filter: none; } 20% { filter: brightness(1.8); } 40% { filter: contrast(2); } 60% { filter: brightness(0.4); } 80% { filter: brightness(2); } 100% { filter: none; } } </style> </head> <body> <!-- ========================================= ENTRY SCREEN ========================================= --> <div id="entry-screen"> <!-- VIDEO --> <video id="entry-video" autoplay muted loop playsinline > <source src="0819.mp4" type="video/mp4" > </video> <div class="entry-overlay"></div> <div class="scanlines"></div> <div class="glitch-noise"></div> <!-- ===================================== ENTRY CONTENT ====================================== --> <div class="entry-content"> <div class="system-text"> FOUNDATION SECURE NETWORK </div> <h1> SITE-66 </h1> <h2> PERSONNEL DATABASE </h2> <div class="loading"> CONNECTION: <span>ESTABLISHED</span> </div> <div class="loading"> SECURITY SYSTEM: <span>ONLINE</span> </div> <div class="warning"> ⚠ AUTHORIZED PERSONNEL ONLY ⚠ </div> <button id="enter-button" onclick="enterSite()" > ENTER DATABASE </button> </div> <!-- ===================================== AUDIO BUTTON ====================================== --> <button id="audio-button" onclick="toggleAudio()" >
